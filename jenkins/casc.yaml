jenkins:
  systemMessage: "CI - API Tienda de Regalos"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8081/"

jobs:
  - script: |
      pipelineJob('backend') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${REPO_URL}')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight()
          }
        }
      }
