services:
  database:
    image: "postgres:latest"
    ports:
      - 5432:5432
    env_file:
      - ./.env
    networks:
      - integracion-continua
    volumes:
      - ./data/:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - ./.env
    expose:
      - "8080"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - database
    networks:
      - integracion-continua
  nginx:
    image: "nginx:alpine"
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - integracion-continua

networks:
  integracion-continua:
    driver: bridge
